name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Some hosted Supabase projects still run PostgreSQL 15; the migrations gate on version.
        postgres: ["16", "15"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZS_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @zs/core test:booking
      - run: pnpm --filter @zs/core test:crm

  # Fast job for the pilot Mac's browser runner (stdlib only: no browser, loopback test servers only, no secrets).
  # `pnpm -r test` never sees it because the pnpm workspace holds only packages/* and apps/*.
  # The redact module strips secrets from step logs, so a regression there must fail the PR.
  browser-runner:
    name: browser-runner (Python 3.12.13)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/browser-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - run: python -I -B -m unittest discover -s tests -t . -v

  # The Plane link script runs only on pull_request_target with secrets; this runs it against a
  # fake Plane (no network, no secrets), so a change to which keys move a work item is tested.
  plane-link-script:
    name: plane-link script (fake Plane)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 -I -B scripts/plane_link_test.py

  e2e:
    runs-on: ubuntu-latest
    # Playwright's own image carries the browsers and their system libraries. Installing them on
    # the runner took up to 12 minutes on a slow apt mirror (2026-10-22). The tag must match
    # @playwright/test in apps/dashboard/package.json; a mismatch fails with "browser not found".
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zs/dashboard e2e
        timeout-minutes: 15
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-e2e-results
          path: apps/dashboard/test-results/
          retention-days: 7
