# ZS Business Connections (preview). No secrets: the client ID is public. Deploy with `shopify app deploy` from this directory's
# config (docs/requirements/connections.md C-19). Managed installation: scopes are declared here, not requested at
# install time, and the app authenticates with session tokens (token exchange), never an OAuth redirect.
client_id = "baad8397402f461c395de7c8b08bacd0"
name = "ZS Business Connections (preview)"
application_url = "https://zs-business-dashboard-preview.vercel.app/shopify/app"
embedded = true

[access_scopes]
# The minimum for reading orders (S1 3.2): not read_all_orders, and no customer scope.
scopes = "read_orders"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://zs-business-dashboard-preview.vercel.app/shopify/app"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://zs-business-workers-preview.vercel.app/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://zs-business-workers-preview.vercel.app/webhooks/shopify"

